<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Урок — Startup Course</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/course.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="./img/logo.png" width="60px" height="60px" alt="logo">
            <h1>Курсы стартапа</h1>
        </div>
        <div class="header_links">
        <!-- <a href="index.html">Главная</a>
        <a href="courses.html">Курсы</a> -->
        
            <div class="user-panel" id="user-panel">
                <img id="user-photo" class="user-photo" src="" alt="avatar">
                <div class="name_email">
                    <span id="user-name"></span>
                    <span id="user-email"></span>
                </div>
                <!-- <div class="user-progress">
                    <span>Прогресс:</span>
                    <div class="progress-bar-bg">
                        <div id="global-progress" class="progress-bar"></div>
                    </div>
                    <span id="global-progress-text">0%</span>
                </div> -->
                <div class="global-progress-container">
                    <span>Прогресс:</span>

                    <div class="percent_cont">
                        <div class="progress-wrapper">
                            <div class="progress-bar-bg">
                                <div id="global-progress" class="progress-bar"></div>
                            </div>
                        </div>
    
                        <span id="global-progress-text" class="progress-text">0%</span>
                    </div>
                </div>


                <button id="logout-btn" class="logout-btn">Выйти</button>
            </div>
        </div>
    </header>
    <!-- <div id="page-transition"></div> -->
    <canvas id="transition-canvas"></canvas>
    <div class="main_container">
        <div class="course_container">
            <aside class="sidebar">
                <h2>Курсы</h2>
                <!-- <div class="sidebar-progress">
                    <p>Прогресс курса:</p>
                    <div class="progress-bar-bg">
                        <div id="course-progress" class="progress-bar"></div>
                    </div>
                    <span id="course-progress-text">0%</span>
                </div> -->
                <div class="sidebar-progress">
                    <p>Прогресс курса:</p>

                    <div class="progress-wrapper">
                        <div class="progress-bar-bg">
                            <div id="course-progress" class="progress-bar"></div>
                        </div>
                    </div>

                    <span id="course-progress-text" class="progress-text">0%</span>
                </div>



                <ul id="course-list"></ul>
            </aside>
            <main class="course-content">
                <h2 id="course-title">Загрузка курса...</h2>
                <p><strong>Цель:</strong> <span id="course-goal"></span></p>
                <p><strong>Результаты:</strong> <span id="course-results"></span></p>
                <p><strong>Инструкция:</strong> <span id="course-instruction"></span></p>
                <p id="course-description"></p>
                <div class="buttons">
                    <button class="action-btn" data-type="lecture">Лекция</button>
                    <button class="action-btn" data-type="video">Видео</button>
                    <button class="action-btn" data-type="practice">Практическое задание</button>
                    <button class="action-btn" data-type="test">Тест</button>
                </div>
    
                <div class="navigation_btn">
                    <button id="all-course" class="all-btn">Все курсы →</button>
                    <button id="next-course" class="next-btn">Следующий курс →</button>
                </div>
        
                <!-- <section class="lesson">
                    <h3>📘 Основной материал</h3>
                    <p id="lesson-text">
                        Здесь будет содержимое урока — текст, советы, ссылки или видео.
                    </p>
                </section>
        
                <section class="task">
                    <h3>🧩 Практическое задание</h3>
                    <p id="task-text">
                        Пример: опиши идею своего стартапа в 3 предложениях.
                    </p>
                </section>
        
                <button class="btn" id="test-btn">Пройти тест</button> -->
            </main>
        </div>
        <!-- modal -->
        <div id="modal" class="modal">
            <div class="modal-content">
                <span id="close-modal" class="close">&times;</span>
                <div id="modal-body"></div>
            </div>
        </div>
    </div>
    <footer>
        <p>© 2025 Startup Course | Inspired by Silicon Valley</p>
    </footer>

    <script src="./js/course.js" type="module"></script>
    <script src="./js/script.js"></script>
</body>
</html>
